name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # 只跑离线用例：真实网络（integration）与需要浏览器的（ui）不在这里跑
      - run: python -m pytest -q -m "not integration and not ui"
